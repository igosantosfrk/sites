<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREAK PLAYER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08080a;
  --card1:#141416;
  --card2:#0d0d0f;
  --panel:#0f0f11;
  --line:rgba(255,255,255,.07);
  --line2:rgba(255,255,255,.12);
  --text:#f3f1ef;
  --dim:#8b8b93;
  --dim2:#5f5f67;
  --red:#e11d2e;
  --red2:#ff3446;
}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:
    radial-gradient(1100px 520px at 50% -8%, rgba(225,29,46,.18), transparent 60%),
    linear-gradient(180deg,#0b0b0e,#070708);
  color:var(--text);
  min-height:100vh;
  padding:34px 18px 70px;
}
.stage{width:100%;max-width:1160px;margin:0 auto}

/* HEADER */
.brand{text-align:center;margin-bottom:26px}
.brand .kicker{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:var(--red2);font-weight:600;margin-bottom:4px}
.brand h1{
  font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(34px,7vw,58px);
  letter-spacing:.02em;line-height:.95;text-transform:uppercase;
  background:linear-gradient(180deg,#fff,#b7b7c0);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 20px rgba(225,29,46,.22));
}
.brand h1 .r{color:var(--red);-webkit-text-fill-color:var(--red)}

/* NOW PLAYING CARD */
.now{
  background:linear-gradient(155deg,var(--card1),var(--card2));
  border:1px solid var(--line);border-radius:22px;
  padding:22px;display:grid;grid-template-columns:250px 1fr;gap:26px;
  box-shadow:0 30px 70px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.03);
}
.cover{
  position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;
  border:1px solid var(--line2);
  background:
    radial-gradient(120% 90% at 50% 15%, rgba(225,29,46,.4), transparent 55%),
    linear-gradient(160deg,#1c0d10,#0a0a0c 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  box-shadow:0 16px 40px rgba(0,0,0,.5);
}
.cover::after{content:"";position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 120%, rgba(225,29,46,.25), transparent 60%)}
.cover .ck{font-family:'Oswald',sans-serif;font-size:9px;letter-spacing:.34em;color:var(--red2);font-weight:600;position:relative;z-index:1}
.cover .cw{font-family:'Oswald',sans-serif;font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;color:#eceaea;position:relative;z-index:1;line-height:1}
.cover .cw .r{color:var(--red)}

.np{display:flex;flex-direction:column;min-width:0}
.np-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.np-eyebrow{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--red2)}
.np-badges{display:flex;align-items:center;gap:8px}
.kbps{font-size:11px;font-weight:600;color:var(--dim);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:99px;padding:5px 11px;letter-spacing:.03em}
.kebab{color:var(--dim2);display:flex;align-items:center;padding:2px}
.kebab svg{width:18px;height:18px;fill:currentColor}
.np-title{font-family:'Oswald',sans-serif;font-weight:600;font-size:30px;letter-spacing:.005em;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-sub{color:var(--dim);font-size:14px;margin-top:2px}

/* WAVEFORM */
.wave-wrap{margin-top:auto;padding-top:26px}
.wave{position:relative;height:52px;cursor:pointer}
.wave-row{display:flex;align-items:center;gap:2px;height:100%;width:100%}
.wave-row span{flex:1;min-width:2px;border-radius:2px}
.wave-gray span{background:rgba(255,255,255,.16)}
.wave-fill{position:absolute;top:0;left:0;height:100%;width:0;overflow:hidden;pointer-events:none}
.wave-red span{background:linear-gradient(180deg,var(--red2),var(--red))}
.wave-head{position:absolute;top:-6px;left:0;transform:translateX(-50%);pointer-events:none;display:flex;flex-direction:column;align-items:center;width:0}
.wave-time{background:var(--red);color:#fff;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;padding:2px 7px;border-radius:6px;white-space:nowrap;box-shadow:0 4px 12px rgba(225,29,46,.5)}
.wave-line{width:2px;height:52px;background:rgba(255,255,255,.85);margin-top:2px}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:8px;font-variant-numeric:tabular-nums}

/* CONTROLS */
.controls{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:18px;flex-wrap:wrap}
.cbtn{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--dim);cursor:pointer;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;transition:.15s}
.cbtn:hover{color:var(--text);border-color:var(--line2)}
.cbtn.active{color:var(--red2);border-color:rgba(225,29,46,.55);background:rgba(225,29,46,.08)}
.cbtn svg{width:17px;height:17px;fill:currentColor}
.ctl-left{display:flex;gap:10px}
.ctl-center{display:flex;align-items:center;gap:20px}
.nav{background:none;border:none;color:var(--text);cursor:pointer;display:flex;padding:4px;transition:.12s}
.nav:hover{color:var(--red2);transform:scale(1.08)}
.nav svg{width:26px;height:26px;fill:currentColor}
.play{width:70px;height:70px;border-radius:50%;background:rgba(225,29,46,.06);border:2px solid var(--red);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 0 26px rgba(225,29,46,.55);transition:.15s}
.play:hover{transform:scale(1.05);box-shadow:0 0 36px rgba(225,29,46,.8)}
.play svg{width:26px;height:26px;fill:#fff}
.ctl-right{display:flex;align-items:center;gap:16px}
.vol{display:flex;align-items:center;gap:9px}
.vol svg{width:19px;height:19px;fill:var(--dim);flex-shrink:0}
input[type=range]{-webkit-appearance:none;appearance:none;width:96px;height:4px;border-radius:99px;background:rgba(255,255,255,.14);cursor:pointer;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(225,29,46,.7)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:#fff}
.chip{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:99px;padding:9px 15px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px}
.chip:hover{color:var(--text);border-color:var(--line2)}
.chip.active{color:var(--red2);border-color:rgba(225,29,46,.55);background:rgba(225,29,46,.08)}

/* PLAYLIST */
.list-card{background:linear-gradient(155deg,var(--card1),var(--card2));border:1px solid var(--line);border-radius:22px;padding:20px 14px;margin-top:22px}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 8px 14px;flex-wrap:wrap}
.list-title{display:flex;align-items:center;gap:12px}
.list-title .lt{font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:.28em;text-transform:uppercase;color:var(--red2);display:flex;align-items:center;gap:8px}
.list-title .lt svg{width:16px;height:16px;fill:var(--red2)}
.list-title .cnt{color:var(--dim);font-size:13px}
.search{position:relative}
.search input{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:99px;color:var(--text);font-size:13px;padding:9px 38px 9px 16px;width:230px;max-width:52vw;outline:none;transition:.15s}
.search input:focus{border-color:rgba(225,29,46,.5)}
.search svg{position:absolute;right:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;fill:var(--dim)}

.track{display:flex;align-items:center;gap:16px;padding:13px 16px;border-radius:12px;cursor:pointer;position:relative;transition:.13s}
.track:hover{background:rgba(255,255,255,.035)}
.track.active{background:linear-gradient(90deg,rgba(225,29,46,.12),transparent 80%)}
.track.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--red)}
.track .num{width:24px;text-align:center;font-size:13px;color:var(--dim2);font-variant-numeric:tabular-nums}
.track.active .num{color:var(--red2)}
.track .eq{display:none;width:24px;height:16px;gap:2px;align-items:flex-end;justify-content:center}
.track.active.playing .num{display:none}
.track.active.playing .eq{display:flex}
.track .eq span{width:3px;background:var(--red2);border-radius:2px;animation:eq .9s ease-in-out infinite}
.track .eq span:nth-child(1){animation-delay:-.5s}
.track .eq span:nth-child(2){animation-delay:-.2s}
.track .eq span:nth-child(3){animation-delay:-.7s}
.track .eq span:nth-child(4){animation-delay:-.35s}
@keyframes eq{0%,100%{height:4px}50%{height:15px}}
.track .tname{flex:1;min-width:0;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track.active .tname{color:var(--red2)}
.track .tdur{color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
.track.active .tdur{color:var(--red2)}
.track .tk{color:var(--dim2);display:flex;padding:2px}
.track .tk svg{width:16px;height:16px;fill:currentColor}
.track.hidden{display:none}

.foot{text-align:center;color:var(--dim2);font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-top:30px;opacity:.7}

@media (max-width:720px){
  .now{grid-template-columns:1fr;gap:18px}
  .cover{max-width:220px;margin:0 auto}
  .np-title{font-size:24px;white-space:normal}
  .wave-wrap{padding-top:18px}
  .controls{justify-content:center;gap:14px}
  .ctl-right{width:100%;justify-content:center}
}
</style>
</head>
<body>
<div class="stage">
  <div class="brand">
    <div class="kicker">Studio Sessions</div>
    <h1>FREAK <span class="r">PLAYER</span></h1>
  </div>

  <!-- NOW PLAYING -->
  <div class="now">
    <div class="cover">
      <span class="ck">Studio Sessions</span>
      <span class="cw">FREAK <span class="r">PLAYER</span></span>
    </div>

    <div class="np">
      <div class="np-top">
        <div>
          <div class="np-eyebrow">Tocando agora</div>
          <div class="np-title" id="npTitle">—</div>
          <div class="np-sub" id="npSub">Freak Brotherz · Studio Sessions</div>
        </div>
        <div class="np-badges">
          <span class="kbps" id="kbps">HD</span>
          <span class="kebab"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></span>
        </div>
      </div>

      <div class="wave-wrap">
        <div class="wave" id="wave">
          <div class="wave-row wave-gray" id="waveGray"></div>
          <div class="wave-fill" id="waveFill"><div class="wave-row wave-red" id="waveRed"></div></div>
          <div class="wave-head" id="waveHead"><span class="wave-time" id="waveTime">0:00</span><span class="wave-line"></span></div>
        </div>
        <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
      </div>

      <div class="controls">
        <div class="ctl-left">
          <button class="cbtn" id="loopBtn" title="Repetir"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
          <button class="cbtn" id="shufBtn" title="Aleatório"><svg viewBox="0 0 24 24"><path d="M10.6 8.6L7 5H3v2h3.2l3 3 1.4-1.4zM14 5l2 2-9 9H3v2h4.8l9.6-9.6L20 20V5h-6z"/></svg></button>
        </div>
        <div class="ctl-center">
          <button class="nav" id="prev" title="Anterior"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
          <button class="play" id="play" title="Play/Pause"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
          <button class="nav" id="next" title="Próxima"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg></button>
        </div>
        <div class="ctl-right">
          <div class="vol">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1-3.29-2.5-4.03v8.05c1.5-.73 2.5-2.25 2.5-4.02z"/></svg>
            <input type="range" id="vol" min="0" max="1" step="0.01" value="1">
          </div>
          <button class="chip" id="loopChip">↻ Loop</button>
          <button class="chip" id="shufChip">⇄ Shuffle</button>
        </div>
      </div>
    </div>
  </div>

  <!-- PLAYLIST -->
  <div class="list-card">
    <div class="list-head">
      <div class="list-title">
        <span class="lt"><svg viewBox="0 0 24 24"><path d="M3 6h13v2H3V6zm0 5h13v2H3v-2zm0 5h9v2H3v-2zm15-9v8.05c-.32-.03-.66 0-1 .1-1.6.43-2.7 1.77-2.5 3 .2 1.23 1.63 1.9 3.23 1.47C19.8 19.3 20 18.2 20 17V7l-2 1z"/></svg> Playlist</span>
        <span class="cnt"><span id="count">0</span> faixas</span>
      </div>
      <div class="search">
        <input type="text" id="search" placeholder="Buscar faixa...">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 10-.7.7l.27.28v.79l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 110-9 4.5 4.5 0 010 9z"/></svg>
      </div>
    </div>
    <div id="tracks"></div>
  </div>

  <div class="foot">Freak Brotherz · Studio Sessions</div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
const TRACKS = [
  {title:"Som, Luz, Câmera, Ação", src:"audio/som-luz-camera-acao.m4a"},
  {title:"Heart Shaped Freak",     src:"audio/heart-shaped-freak.m4a"},
  {title:"Reggae Crazy",           src:"audio/reggae-crazy.m4a"},
  {title:"Pode Ser Divertido 2",   src:"audio/pode-ser-divertido-2.m4a"},
  {title:"Panana Pléw",            src:"audio/panana-plew.m4a"},
  {title:"Quem? 01",               src:"audio/quem-01.m4a"},
  {title:"Faixa 01",               src:"audio/track-01.mp3"},
  {title:"Faixa 02",               src:"audio/track-02.mp3"},
  {title:"Faixa 03",               src:"audio/track-03.mp3"},
  {title:"Faixa 04",               src:"audio/track-04.mp3"},
];

const audio = document.getElementById('audio');
const $ = id => document.getElementById(id);
const els = {
  npTitle:$('npTitle'), npSub:$('npSub'),
  play:$('play'), playIcon:$('playIcon'), prev:$('prev'), next:$('next'),
  wave:$('wave'), waveGray:$('waveGray'), waveRed:$('waveRed'), waveFill:$('waveFill'),
  waveHead:$('waveHead'), waveTime:$('waveTime'),
  cur:$('cur'), dur:$('dur'), vol:$('vol'),
  loopBtn:$('loopBtn'), shufBtn:$('shufBtn'), loopChip:$('loopChip'), shufChip:$('shufChip'),
  tracks:$('tracks'), count:$('count'), search:$('search'),
};

let current=-1, isLoop=false, isShuffle=false;
const PLAY='<path d="M8 5v14l11-7z"/>';
const PAUSE='<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
const fmt = s => (!s||isNaN(s))?'0:00':Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');

/* ---- waveform bars (deterministic) ---- */
const NBARS=90, heights=[];
let seed=7;
const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
for(let i=0;i<NBARS;i++){
  const base=0.35+0.65*Math.abs(Math.sin(i*0.35))*rnd()+0.15*rnd();
  heights.push(Math.max(14,Math.min(100,Math.round(base*100))));
}
const barsHTML = heights.map(h=>`<span style="height:${h}%"></span>`).join('');
els.waveGray.innerHTML = barsHTML;
els.waveRed.innerHTML = barsHTML;
function syncWaveWidth(){ els.waveRed.style.width = els.wave.clientWidth+'px'; }
window.addEventListener('resize', syncWaveWidth);
syncWaveWidth();

/* ---- playlist ---- */
function buildList(){
  els.count.textContent = TRACKS.length;
  TRACKS.forEach((t,i)=>{
    const row=document.createElement('div');
    row.className='track'; row.dataset.i=i;
    row.innerHTML =
      '<div class="num">'+String(i+1).padStart(2,'0')+'</div>'+
      '<div class="eq"><span></span><span></span><span></span><span></span></div>'+
      '<div class="tname">'+t.title+'</div>'+
      '<div class="tdur" id="d-'+i+'">--:--</div>'+
      '<span class="tk"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></span>';
    row.addEventListener('click',e=>{ if(e.target.closest('.tk'))return; i===current?toggle():load(i,true); });
    els.tracks.appendChild(row);
    const probe=new Audio(); probe.preload='metadata'; probe.src=t.src;
    probe.addEventListener('loadedmetadata',()=>{ const el=$('d-'+i); if(el) el.textContent=fmt(probe.duration); });
  });
}

function load(i,autoplay){
  current=i; const t=TRACKS[i];
  audio.src=t.src;
  els.npTitle.textContent=t.title;
  els.npSub.textContent='Freak Brotherz · Studio Sessions';
  document.querySelectorAll('.track').forEach(r=>r.classList.remove('active','playing'));
  const row=document.querySelector('.track[data-i="'+i+'"]');
  if(row) row.classList.add('active');
  els.waveFill.style.width='0%'; els.waveHead.style.left='0%'; els.waveTime.textContent='0:00';
  if(autoplay) audio.play();
}
function toggle(){ if(current===-1){load(0,true);return;} audio.paused?audio.play():audio.pause(); }
function playNext(){
  if(isShuffle){ let n; do{n=Math.floor(Math.random()*TRACKS.length)}while(TRACKS.length>1&&n===current); load(n,true); return; }
  load((current+1)%TRACKS.length,true);
}
function playPrev(){ if(audio.currentTime>3){audio.currentTime=0;return;} load((current-1+TRACKS.length)%TRACKS.length,true); }

els.play.addEventListener('click',toggle);
els.next.addEventListener('click',playNext);
els.prev.addEventListener('click',playPrev);

audio.addEventListener('play',()=>{
  els.playIcon.innerHTML=PAUSE;
  const r=document.querySelector('.track.active'); if(r) r.classList.add('playing');
});
audio.addEventListener('pause',()=>{
  els.playIcon.innerHTML=PLAY;
  const r=document.querySelector('.track.active'); if(r) r.classList.remove('playing');
});
audio.addEventListener('timeupdate',()=>{
  const pct=audio.duration?(audio.currentTime/audio.duration*100):0;
  els.waveFill.style.width=pct+'%';
  els.waveHead.style.left=pct+'%';
  els.waveTime.textContent=fmt(audio.currentTime);
  els.cur.textContent=fmt(audio.currentTime);
});
audio.addEventListener('loadedmetadata',()=>{ els.dur.textContent=fmt(audio.duration); syncWaveWidth(); });
audio.addEventListener('ended',()=>{ if(isLoop){audio.currentTime=0;audio.play();}else playNext(); });

function seek(e){
  const r=els.wave.getBoundingClientRect();
  const x=((e.touches?e.touches[0].clientX:e.clientX)-r.left)/r.width;
  if(audio.duration) audio.currentTime=Math.max(0,Math.min(1,x))*audio.duration;
}
els.wave.addEventListener('click',seek);

els.vol.addEventListener('input',()=>{ audio.volume=els.vol.value; });

function setLoop(v){ isLoop=v; els.loopBtn.classList.toggle('active',v); els.loopChip.classList.toggle('active',v); }
function setShuffle(v){ isShuffle=v; els.shufBtn.classList.toggle('active',v); els.shufChip.classList.toggle('active',v); }
els.loopBtn.addEventListener('click',()=>setLoop(!isLoop));
els.loopChip.addEventListener('click',()=>setLoop(!isLoop));
els.shufBtn.addEventListener('click',()=>setShuffle(!isShuffle));
els.shufChip.addEventListener('click',()=>setShuffle(!isShuffle));

els.search.addEventListener('input',()=>{
  const q=els.search.value.trim().toLowerCase();
  let shown=0;
  document.querySelectorAll('.track').forEach(r=>{
    const name=TRACKS[+r.dataset.i].title.toLowerCase();
    const match=name.includes(q);
    r.classList.toggle('hidden',!match);
    if(match) shown++;
  });
  els.count.textContent=shown;
});

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();toggle();}
  if(e.code==='ArrowRight')playNext();
  if(e.code==='ArrowLeft')playPrev();
});

buildList();
</script>
</body>
</html>
