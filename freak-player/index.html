<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREAK PLAYER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0c;
  --bg2:#121216;
  --panel:#17171d;
  --panel2:#1e1e26;
  --border:rgba(255,255,255,.08);
  --border-s:rgba(255,255,255,.16);
  --text:#f2f0ee;
  --dim:#8a8a94;
  --accent:#e11d2e;
  --accent-g:#ff3b4e;
}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:
    radial-gradient(900px 500px at 50% -10%, rgba(225,29,46,.16), transparent 60%),
    linear-gradient(180deg,#0c0c0f,#060608);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:32px 16px 60px;
}
.stage{width:100%;max-width:520px}

/* HEADER */
.brand{text-align:center;margin-bottom:26px}
.brand .kicker{
  font-family:'Oswald',sans-serif;
  font-size:12px;letter-spacing:.42em;text-transform:uppercase;
  color:var(--accent-g);font-weight:600;margin-bottom:6px;
}
.brand h1{
  font-family:'Oswald',sans-serif;
  font-weight:700;font-size:clamp(38px,11vw,60px);
  letter-spacing:.02em;line-height:.92;text-transform:uppercase;
  background:linear-gradient(180deg,#fff,#b9b9c2);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 18px rgba(225,29,46,.25));
}
.brand h1 .freak{color:var(--accent);-webkit-text-fill-color:var(--accent)}

/* NOW PLAYING */
.now{
  background:linear-gradient(160deg,var(--panel),var(--panel2));
  border:1px solid var(--border);
  border-radius:18px;padding:24px 22px 20px;
  box-shadow:0 24px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.04);
}
.art{
  aspect-ratio:1/1;width:100%;max-width:230px;margin:0 auto 20px;
  border-radius:16px;position:relative;
  background:
    radial-gradient(circle at 50% 45%, rgba(225,29,46,.22), transparent 62%),
    linear-gradient(145deg,#1a1a20,#0c0c10);
  border:1px solid var(--border-s);
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}
.art .logo{
  width:78%;height:78%;
  filter:drop-shadow(0 4px 20px rgba(225,29,46,.45));
  transition:filter .3s, transform .3s;
}
.art.playing .logo{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{
  0%,100%{filter:drop-shadow(0 4px 16px rgba(225,29,46,.35));transform:scale(1)}
  50%{filter:drop-shadow(0 6px 28px rgba(225,29,46,.75));transform:scale(1.03)}
}

.np-title{font-family:'Oswald',sans-serif;font-weight:600;font-size:22px;text-align:center;letter-spacing:.01em}
.np-sub{text-align:center;color:var(--dim);font-size:12.5px;margin-top:3px;letter-spacing:.14em;text-transform:uppercase}

/* PROGRESS */
.progress{margin:20px 2px 6px}
.bar{height:6px;background:rgba(255,255,255,.09);border-radius:99px;position:relative;cursor:pointer}
.bar .fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-g));border-radius:99px}
.bar .knob{position:absolute;top:50%;left:0;width:13px;height:13px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 10px rgba(225,29,46,.8);opacity:0;transition:opacity .15s}
.bar:hover .knob{opacity:1}
.times{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-top:8px;font-variant-numeric:tabular-nums}

/* CONTROLS */
.controls{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:14px}
.ctrl{background:none;border:none;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:6px;border-radius:50%;transition:transform .12s,color .12s}
.ctrl:hover{color:var(--accent-g);transform:scale(1.08)}
.ctrl svg{width:26px;height:26px;fill:currentColor}
.play-btn{width:64px;height:64px;border-radius:50%;background:linear-gradient(180deg,var(--accent-g),var(--accent));box-shadow:0 10px 26px rgba(225,29,46,.45)}
.play-btn:hover{transform:scale(1.06);color:#fff}
.play-btn svg{width:28px;height:28px;fill:#fff}

.extra{display:flex;align-items:center;justify-content:space-between;margin-top:18px;gap:14px}
.vol{display:flex;align-items:center;gap:8px;flex:1}
.vol svg{width:18px;height:18px;fill:var(--dim);flex-shrink:0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:99px;background:rgba(255,255,255,.12);cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--accent-g);box-shadow:0 0 8px rgba(225,29,46,.6)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:var(--accent-g)}
.chip{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:99px;padding:6px 12px;cursor:pointer;transition:.15s}
.chip.active{color:var(--accent-g);border-color:rgba(225,29,46,.5)}

/* PLAYLIST */
.list{margin-top:22px}
.list-head{font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin:0 4px 10px}
.track{
  display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;cursor:pointer;
  border:1px solid transparent;transition:.14s;
}
.track:hover{background:rgba(255,255,255,.04)}
.track.active{background:linear-gradient(90deg,rgba(225,29,46,.14),rgba(225,29,46,.02));border-color:rgba(225,29,46,.35)}
.track .num{width:22px;text-align:center;font-family:'Oswald',sans-serif;color:var(--dim);font-size:15px;font-variant-numeric:tabular-nums}
.track.active .num{color:var(--accent-g)}
.track .eq{display:none;gap:2px;width:22px;justify-content:center;align-items:flex-end;height:16px}
.track.active.playing .num{display:none}
.track.active.playing .eq{display:flex}
.track .eq span{width:3px;background:var(--accent-g);border-radius:2px;animation:eq .8s ease-in-out infinite}
.track .eq span:nth-child(1){animation-delay:-.4s}
.track .eq span:nth-child(2){animation-delay:-.15s}
.track .eq span:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:4px}50%{height:15px}}
.track .meta{flex:1;min-width:0}
.track .t-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track.active .t-name{color:var(--accent-g)}
.track .t-dur{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}

.foot{text-align:center;color:var(--dim);font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-top:34px;opacity:.6}
</style>
</head>
<body>
<div class="stage">
  <div class="brand">
    <div class="kicker">Studio Sessions</div>
    <h1>FREAK <span class="freak">PLAYER</span></h1>
  </div>

  <div class="now">
    <div class="art" id="art">
      <svg class="logo" viewBox="0 0 200 200" role="img" aria-label="Freak Brotherz">
        <defs>
          <path id="arcBottom" d="M 42 122 A 58 58 0 0 0 158 122"/>
        </defs>
        <g fill="none" stroke="#d81f26" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
          <!-- anel externo -->
          <circle cx="100" cy="100" r="92" stroke-width="5"/>
          <circle cx="100" cy="100" r="83"/>
          <!-- estrela de 5 pontas -->
          <path d="M100,32 L117.2,78.5 L167.1,80.4 L128.5,111.3 L141.9,159.6 L100,132 L58.1,159.6 L71.5,111.3 L32.9,80.4 L82.8,78.5 Z" stroke-width="3.5"/>
        </g>
        <!-- monograma A B -->
        <g fill="#d81f26" font-family="'Oswald',sans-serif" font-weight="700" text-anchor="middle" stroke="#d81f26">
          <text x="98" y="140" font-size="118" stroke-width="1.5">A</text>
          <text x="112" y="140" font-size="70" stroke-width="1">B</text>
        </g>
        <!-- texto curvo inferior -->
        <text fill="#d81f26" font-family="'Oswald',sans-serif" font-weight="700" font-size="15" letter-spacing="2.5">
          <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">★ FREAK BROTHERZ ★</textPath>
        </text>
      </svg>
    </div>
    <div class="np-title" id="npTitle">—</div>
    <div class="np-sub" id="npSub">Selecione uma faixa</div>

    <div class="progress">
      <div class="bar" id="bar">
        <div class="fill" id="fill"></div>
        <div class="knob" id="knob"></div>
      </div>
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>

    <div class="controls">
      <button class="ctrl" id="prev" title="Anterior"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
      <button class="ctrl play-btn" id="play" title="Play/Pause"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="ctrl" id="next" title="Próxima"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg></button>
    </div>

    <div class="extra">
      <div class="vol">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1-3.29-2.5-4.03v8.05c1.5-.73 2.5-2.25 2.5-4.02z"/></svg>
        <input type="range" id="vol" min="0" max="1" step="0.01" value="1">
      </div>
      <button class="chip" id="loop" title="Repetir">↻ Loop</button>
      <button class="chip" id="shuffle" title="Aleatório">⇄ Shuffle</button>
    </div>
  </div>

  <div class="list">
    <div class="list-head">Faixas</div>
    <div id="tracks"></div>
  </div>

  <div class="foot">FREAK · 10 faixas</div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
const TRACKS = [
  {title:"Som, Luz, Câmera, Ação", src:"audio/som-luz-camera-acao.m4a"},
  {title:"Heart Shaped Freak",     src:"audio/heart-shaped-freak.m4a"},
  {title:"Reggae Crazy",           src:"audio/reggae-crazy.m4a"},
  {title:"Pode Ser Divertido 2",   src:"audio/pode-ser-divertido-2.m4a"},
  {title:"Panana Pléw",            src:"audio/panana-plew.m4a"},
  {title:"Quem? 01",               src:"audio/quem-01.m4a"},
  {title:"Faixa 01",               src:"audio/track-01.mp3"},
  {title:"Faixa 02",               src:"audio/track-02.mp3"},
  {title:"Faixa 03",               src:"audio/track-03.mp3"},
  {title:"Faixa 04",               src:"audio/track-04.mp3"},
];

const audio = document.getElementById('audio');
const els = {
  tracks:document.getElementById('tracks'),
  npTitle:document.getElementById('npTitle'),
  npSub:document.getElementById('npSub'),
  play:document.getElementById('play'),
  playIcon:document.getElementById('playIcon'),
  prev:document.getElementById('prev'),
  next:document.getElementById('next'),
  bar:document.getElementById('bar'),
  fill:document.getElementById('fill'),
  knob:document.getElementById('knob'),
  cur:document.getElementById('cur'),
  dur:document.getElementById('dur'),
  vol:document.getElementById('vol'),
  loop:document.getElementById('loop'),
  shuffle:document.getElementById('shuffle'),
  art:document.getElementById('art'),
};

let current = -1, isLoop = false, isShuffle = false;
const PLAY = '<path d="M8 5v14l11-7z"/>';
const PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';

function fmt(s){ if(!s||isNaN(s))return '0:00'; const m=Math.floor(s/60), x=Math.floor(s%60); return m+':'+String(x).padStart(2,'0'); }

function buildList(){
  TRACKS.forEach((t,i)=>{
    const row = document.createElement('div');
    row.className = 'track';
    row.dataset.i = i;
    row.innerHTML =
      '<div class="num">'+String(i+1).padStart(2,'0')+'</div>'+
      '<div class="eq"><span></span><span></span><span></span></div>'+
      '<div class="meta"><div class="t-name">'+t.title+'</div></div>'+
      '<div class="t-dur" id="dur-'+i+'">--:--</div>';
    row.addEventListener('click', ()=>{ if(i===current){ toggle(); } else { load(i, true); } });
    els.tracks.appendChild(row);
    // pré-carrega duração
    const probe = new Audio();
    probe.preload = 'metadata';
    probe.src = t.src;
    probe.addEventListener('loadedmetadata', ()=>{ document.getElementById('dur-'+i).textContent = fmt(probe.duration); });
  });
}

function load(i, autoplay){
  current = i;
  const t = TRACKS[i];
  audio.src = t.src;
  els.npTitle.textContent = t.title;
  els.npSub.textContent = 'Faixa ' + String(i+1).padStart(2,'0');
  document.querySelectorAll('.track').forEach(r=>r.classList.remove('active','playing'));
  const row = document.querySelector('.track[data-i="'+i+'"]');
  if(row) row.classList.add('active');
  if(autoplay) audio.play();
}

function toggle(){
  if(current===-1){ load(0,true); return; }
  if(audio.paused) audio.play(); else audio.pause();
}

function playNext(){
  if(isShuffle){ let n; do{ n=Math.floor(Math.random()*TRACKS.length); }while(TRACKS.length>1 && n===current); load(n,true); return; }
  load((current+1)%TRACKS.length, true);
}
function playPrev(){
  if(audio.currentTime>3){ audio.currentTime=0; return; }
  load((current-1+TRACKS.length)%TRACKS.length, true);
}

els.play.addEventListener('click', toggle);
els.next.addEventListener('click', playNext);
els.prev.addEventListener('click', playPrev);

audio.addEventListener('play', ()=>{
  els.playIcon.innerHTML = PAUSE;
  els.art.classList.add('playing');
  const row=document.querySelector('.track.active'); if(row) row.classList.add('playing');
});
audio.addEventListener('pause', ()=>{
  els.playIcon.innerHTML = PLAY;
  els.art.classList.remove('playing');
  const row=document.querySelector('.track.active'); if(row) row.classList.remove('playing');
});
audio.addEventListener('timeupdate', ()=>{
  const pct = audio.duration ? (audio.currentTime/audio.duration*100) : 0;
  els.fill.style.width = pct+'%';
  els.knob.style.left = pct+'%';
  els.cur.textContent = fmt(audio.currentTime);
});
audio.addEventListener('loadedmetadata', ()=>{ els.dur.textContent = fmt(audio.duration); });
audio.addEventListener('ended', ()=>{ if(isLoop){ audio.currentTime=0; audio.play(); } else { playNext(); } });

function seek(e){
  const r = els.bar.getBoundingClientRect();
  const x = ((e.touches?e.touches[0].clientX:e.clientX) - r.left)/r.width;
  if(audio.duration) audio.currentTime = Math.max(0,Math.min(1,x))*audio.duration;
}
els.bar.addEventListener('click', seek);

els.vol.addEventListener('input', ()=>{ audio.volume = els.vol.value; });
els.loop.addEventListener('click', ()=>{ isLoop=!isLoop; els.loop.classList.toggle('active',isLoop); });
els.shuffle.addEventListener('click', ()=>{ isShuffle=!isShuffle; els.shuffle.classList.toggle('active',isShuffle); });

document.addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); toggle(); }
  if(e.code==='ArrowRight') playNext();
  if(e.code==='ArrowLeft') playPrev();
});

buildList();
</script>
</body>
</html>
