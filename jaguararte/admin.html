<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscrições — JaguarArte 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --verde: #4d5f33; --verde-escuro: #3d4c28; --creme: #f7f1e6; --papel: #fffdf8; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Poppins', sans-serif; background: var(--creme); color: var(--verde-escuro); min-height: 100vh; padding: 24px 16px; }
  .container { max-width: 1100px; margin: 0 auto; }
  h1 { font-family: 'Fraunces', serif; font-weight: 800; color: var(--verde); font-size: 1.9rem; }
  .topo { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
  .login { max-width: 380px; margin: 80px auto; background: var(--papel); padding: 32px; border-radius: 16px; box-shadow: 0 10px 40px rgba(77,95,51,.12); text-align: center; }
  .login h1 { margin-bottom: 18px; }
  input[type=password] { width: 100%; padding: 12px 14px; border: 1.5px solid #d8d2c2; border-radius: 10px; font-size: 1rem; font-family: inherit; margin-bottom: 14px; }
  button, .btn { background: var(--verde); color: #fdfaf2; border: none; border-radius: 10px; padding: 11px 20px; font-family: inherit; font-size: .92rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
  button:hover, .btn:hover { background: var(--verde-escuro); }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat { background: var(--papel); border-radius: 12px; padding: 14px 20px; box-shadow: 0 4px 14px rgba(77,95,51,.08); }
  .stat b { display: block; font-size: 1.5rem; color: var(--verde); font-family: 'Fraunces', serif; }
  .stat span { font-size: .78rem; color: #8a8676; }
  .tabela { background: var(--papel); border-radius: 14px; box-shadow: 0 6px 24px rgba(77,95,51,.1); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; min-width: 760px; }
  th { background: var(--verde); color: #fdfaf2; text-align: left; padding: 12px 14px; font-weight: 600; white-space: nowrap; }
  td { padding: 11px 14px; border-bottom: 1px solid #eee8da; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  td a { color: var(--verde); font-weight: 500; }
  .badge { background: #e8ecdd; color: var(--verde); border-radius: 999px; padding: 3px 10px; font-size: .75rem; font-weight: 600; white-space: nowrap; }
  .vazio { text-align: center; padding: 50px; color: #8a8676; }
  .erro { color: #a33d2e; font-size: .85rem; margin-top: 8px; display: none; }
</style>
</head>
<body>
<div class="container">
  <div class="login" id="login">
    <h1>JaguarArte 2026</h1>
    <p style="margin-bottom:16px;font-size:.9rem;color:#5c6b47">Painel de inscrições</p>
    <input type="password" id="senha" placeholder="Senha de acesso" onkeydown="if(event.key==='Enter')entrar()">
    <button onclick="entrar()" style="width:100%">Entrar</button>
    <p class="erro" id="loginErro">Senha incorreta.</p>
  </div>

  <div id="painel" style="display:none">
    <div class="topo">
      <h1>Inscrições — JaguarArte 2026</h1>
      <div style="display:flex;gap:10px">
        <button onclick="carregar()">Atualizar</button>
        <a class="btn" id="btnCsv" href="#">Baixar CSV (Excel)</a>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="tabela">
      <table>
        <thead>
          <tr><th>#</th><th>Nome</th><th>Grupo / Artista</th><th>WhatsApp</th><th>Categoria</th><th>Vídeo</th><th>Data</th></tr>
        </thead>
        <tbody id="corpo"><tr><td colspan="7" class="vazio">Carregando...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  let pass = sessionStorage.getItem('jaguararte_pass') || '';

  function entrar() {
    pass = document.getElementById('senha').value;
    carregar(true);
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  async function carregar(doLogin) {
    try {
      const r = await fetch('https://lp.seusite.space/jaguararte-api/api/inscricoes', { headers: { 'x-admin-pass': pass } });
      if (r.status === 401) {
        if (doLogin) document.getElementById('loginErro').style.display = 'block';
        sessionStorage.removeItem('jaguararte_pass');
        return;
      }
      sessionStorage.setItem('jaguararte_pass', pass);
      document.getElementById('login').style.display = 'none';
      document.getElementById('painel').style.display = 'block';
      document.getElementById('btnCsv').href = 'https://lp.seusite.space/jaguararte-api/api/inscricoes.csv?pass=' + encodeURIComponent(pass);

      const j = await r.json();
      const list = j.inscricoes || [];

      const porCat = {};
      list.forEach(i => { const c = i.categoria.split(':')[0]; porCat[c] = (porCat[c] || 0) + 1; });
      document.getElementById('stats').innerHTML =
        `<div class="stat"><b>${list.length}</b><span>Total de inscrições</span></div>` +
        Object.entries(porCat).map(([c, n]) => `<div class="stat"><b>${n}</b><span>${esc(c)}</span></div>`).join('');

      const corpo = document.getElementById('corpo');
      if (!list.length) {
        corpo.innerHTML = '<tr><td colspan="7" class="vazio">Nenhuma inscrição ainda.</td></tr>';
        return;
      }
      corpo.innerHTML = list.slice().reverse().map(i => {
        const fone = i.whatsapp.replace(/\D/g, '');
        const videos = (i.videos || [i.video]).filter(Boolean);
        const linksVideo = videos.map((v, n) =>
          `<a href="${esc(v)}" target="_blank" rel="noopener">${videos.length > 1 ? 'Vídeo ' + (n + 1) : 'Ver vídeo'} ↗</a>`
        ).join('<br>');
        return `<tr>
          <td>${i.id}</td>
          <td><strong>${esc(i.nome)}</strong></td>
          <td>${esc(i.grupo)}</td>
          <td><a href="https://wa.me/55${fone}" target="_blank">${esc(i.whatsapp)}</a></td>
          <td><span class="badge">${esc(i.categoria)}</span></td>
          <td>${linksVideo}</td>
          <td style="white-space:nowrap">${esc(i.data)}</td>
        </tr>`;
      }).join('');
    } catch {
      if (doLogin) document.getElementById('loginErro').style.display = 'block';
    }
  }

  if (pass) carregar();
</script>
</body>
</html>
